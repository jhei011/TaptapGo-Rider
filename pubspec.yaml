name: taptap_go
description: TaptapGo Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # A clock tests can move forward (the rider's 30-minute idle logout)
  clock: ^1.1.1

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.1

  # Secure local storage for auth token
  flutter_secure_storage: ^9.0.0

  # Image handling (cached_network_image removed with the buyer/seller screens that used it)

  # Image picker (for valid ID, OR/CR uploads)
  image_picker: ^1.1.2

  # File picker — allows PDF + image selection for document uploads
  file_picker: ^8.1.2

  # Shared preferences (non-sensitive prefs)
  shared_preferences: ^2.2.3

  # Network connectivity detection
  connectivity_plus: ^6.0.3

  # Icons
  cupertino_icons: ^1.0.8

  # Intl / date formatting
  intl: ^0.20.0

  # Deep link handling (taptapgo://reset-password?token=X&email=Y)
  app_links: ^6.3.4

  # URL launcher
  url_launcher: ^6.3.0
  geolocator: ^14.0.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6

  # Google sign-in (same OAuth project and web client id as TaptapShop) and the
  # official Google "G" logo (assets/images/google_g.svg)
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.10
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  # Icon sources live in assets/icon/ (not bundled into the app).
  # The rider logo centred on white. Its farthest point is 0.43 of the image from the
  # centre, so circle / rounded-square launchers and iOS rounding never crop it.
  # app_icon.png = logo on white (older Android, iPhone); app_icon_foreground.png = the
  # same logo, transparent, over a white adaptive background (Android 8+).
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  android_icon_scale: 1.0
  web:
    generate: false
